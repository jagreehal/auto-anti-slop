name: Changeset

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check for a changeset
        run: |
          # A release pull request consumes changesets and adds none: deleted .changeset/*.md marks one.
          if git diff --diff-filter=D --name-only origin/main...HEAD | grep -qE '^\.changeset/.+\.md$'; then
            echo "Release pull request: skipping."
            exit 0
          fi
          pnpm changeset status --since=origin/main
