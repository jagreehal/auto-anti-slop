name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'jagreehal/auto-anti-slop'
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm 12 prints `npm info --json` as an array; changeset publish expects an object.
      - run: npm install -g npm@11
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # With changesets pending, opens or updates the release pull request; otherwise publishes
      # any version not yet on npm. `pnpm release` runs the checks and tests first.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          NPM_CONFIG_PROVENANCE: true
